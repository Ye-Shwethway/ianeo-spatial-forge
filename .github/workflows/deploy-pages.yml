name: Deploy Viewer to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "viewer/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy viewer to Cloudflare Pages
        run: npx wrangler@latest pages deploy viewer --project-name=ianeo-spatial-forge --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify Pages routes
        shell: bash
        run: |
          set -euo pipefail

          verify_route() {
            local url="$1"
            local name="$2"
            local headers body status
            headers="$RUNNER_TEMP/${name}.headers"
            body="$RUNNER_TEMP/${name}.body"

            curl --silent --show-error --retry 6 --retry-delay 5 \
              --dump-header "$headers" --output "$body" "$url"
            status=$(awk 'NR==1 {print $2}' "$headers")

            if [ "$status" = "200" ]; then
              grep -F "IANEO Spatial Forge" "$body"
              echo "$name: public viewer reachable"
              return 0
            fi

            if [ "$status" = "302" ] || [ "$status" = "303" ]; then
              grep -Eqi '^location: .*cloudflareaccess\.com' "$headers"
              echo "$name: Cloudflare Access gate reachable"
              return 0
            fi

            echo "$name: unexpected HTTP status $status" >&2
            cat "$headers" >&2
            return 1
          }

          verify_route https://ianeo-spatial-forge.pages.dev/ pages-dev
          verify_route https://forge.drthorne.uk/ custom-domain
