name: Character Revision Proof

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/character-revision.yml"
      - "scripts/build_character.py"
      - "scripts/validate_glb.py"
      - "schemas/character-build.schema.json"
      - "schemas/build-result.schema.json"
      - "fixtures/generic-character-v1.json"
      - "fixtures/generic-character-v2.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  revision-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_ARCHIVE: "blender-4.5.12-linux-x64.tar.xz"
      BLENDER_URL: "https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz"
      SF_EXPECTED_MPFB_VERSION: "2.0.17"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check revision JSON
        run: |
          set -euo pipefail
          python -m json.tool schemas/character-build.schema.json >/dev/null
          python -m json.tool schemas/build-result.schema.json >/dev/null
          python -m json.tool fixtures/generic-character-v1.json >/dev/null
          python -m json.tool fixtures/generic-character-v2.json >/dev/null

      - name: Install headless render runtime
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Download Blender
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 "$BLENDER_URL" --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          tar -xJf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install MPFB extension
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --online-mode --command extension install -s -e mpfb
          "$RUNNER_TEMP/blender/blender" --command extension list | grep -i mpfb

      - name: Build parent v1
        env:
          SF_MANIFEST: "${{ github.workspace }}/fixtures/generic-character-v1.json"
          SF_OUTPUT_DIR: "${{ github.workspace }}/output/revision/v1"
        run: |
          set -euo pipefail
          mkdir -p "$SF_OUTPUT_DIR"
          "$RUNNER_TEMP/blender/blender" --background --python scripts/build_character.py

      - name: Build scoped revision v2
        env:
          SF_MANIFEST: "${{ github.workspace }}/fixtures/generic-character-v2.json"
          SF_PARENT_MANIFEST: "${{ github.workspace }}/fixtures/generic-character-v1.json"
          SF_OUTPUT_DIR: "${{ github.workspace }}/output/revision/v2"
        run: |
          set -euo pipefail
          mkdir -p "$SF_OUTPUT_DIR"
          "$RUNNER_TEMP/blender/blender" --background --python scripts/build_character.py

      - name: Verify revision semantics
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          v1 = json.loads(Path('output/revision/v1/build-result.json').read_text())
          v2 = json.loads(Path('output/revision/v2/build-result.json').read_text())

          assert v1['character_id'] == v2['character_id'] == 'generic-character'
          assert v1['version'] == 1
          assert v2['version'] == 2
          assert v2['revision']['parent_version'] == 1

          expected_locks = [
              'phenotype.gender',
              'phenotype.age',
              'phenotype.weight',
              'phenotype.height',
              'phenotype.proportions',
          ]
          assert v2['revision']['locked_fields'] == expected_locks

          for name in ['gender', 'age', 'weight', 'height', 'proportions']:
              assert v2['applied_controls'][name] == v1['applied_controls'][name]
          assert v1['applied_controls']['muscle'] == 0.72
          assert v2['applied_controls']['muscle'] == 0.52

          assert v1['structural']['skin_count'] == v2['structural']['skin_count'] == 1
          assert v1['structural']['joint_count'] == v2['structural']['joint_count'] == 53
          print('Scoped revision semantics verified')
          PY

      - name: Fresh-import revised GLB
        env:
          SF_GLB_PATH: "${{ github.workspace }}/output/revision/v2/generic-character-v2.glb"
          SF_FRESH_IMPORT_RESULT: "${{ github.workspace }}/output/revision/v2/fresh-import.json"
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --python scripts/validate_glb.py

      - name: Verify revised artifact
        run: |
          set -euo pipefail
          test -s output/revision/v1/front.png
          test -s output/revision/v1/three-quarter.png
          test -s output/revision/v2/front.png
          test -s output/revision/v2/three-quarter.png
          test -s output/revision/v2/generic-character-v2.glb
          test -s output/revision/v2/fresh-import.json
          python - <<'PY'
          import json
          from pathlib import Path
          fresh = json.loads(Path('output/revision/v2/fresh-import.json').read_text())
          assert fresh['status'] == 'success'
          assert fresh['armatures'] == 1
          assert fresh['joint_count'] == 53
          print(json.dumps(fresh, indent=2))
          PY

      - name: Upload revision proof artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spatial-forge-character-revision
          path: output/revision/
          if-no-files-found: error
          retention-days: 7
