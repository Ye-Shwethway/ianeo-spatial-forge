name: Character Face Sculpt P3Q.3B

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/character-face-sculpt.yml"
      - "scripts/build_face_quality.py"
      - "scripts/build_character.py"
      - "scripts/validate_glb.py"
      - "fixtures/generic-character-v1.json"
      - "fixtures/generic-face-sculpt-v2.json"

permissions:
  contents: read

jobs:
  face-sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BLENDER_ARCHIVE: "blender-4.5.12-linux-x64.tar.xz"
      BLENDER_URL: "https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz"
      SF_MANIFEST: "${{ github.workspace }}/fixtures/generic-character-v1.json"
      SF_FACE_PROFILE: "${{ github.workspace }}/fixtures/generic-face-sculpt-v2.json"
      SF_OUTPUT_DIR: "${{ github.workspace }}/output/face-sculpt-v2"
      SF_EXPECTED_MPFB_VERSION: "2.0.17"
      SF_GLB_PATH: "${{ github.workspace }}/output/face-sculpt-v2/generic-character-face-sculpt-v2.glb"
      SF_FRESH_IMPORT_RESULT: "${{ github.workspace }}/output/face-sculpt-v2/fresh-import.json"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inputs
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool fixtures/generic-character-v1.json >/dev/null
          python -m json.tool fixtures/generic-face-sculpt-v2.json >/dev/null
          python -m py_compile scripts/build_character.py scripts/build_face_quality.py scripts/validate_glb.py

      - name: Install headless render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Download Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 "$BLENDER_URL" --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          tar -xJf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install MPFB extension
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --online-mode --command extension install -s -e mpfb
          "$RUNNER_TEMP/blender/blender" --command extension list | grep -i mpfb

      - name: Build visible face sculpt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SF_OUTPUT_DIR"
          "$RUNNER_TEMP/blender/blender" --background --python scripts/build_face_quality.py

      - name: Fresh-import exported GLB
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --python scripts/validate_glb.py

      - name: Upload P3Q.3B artifact before assertions
        uses: actions/upload-artifact@v4
        with:
          name: spatial-forge-character-face-sculpt-v2
          path: output/face-sculpt-v2/
          if-no-files-found: error
          retention-days: 7

      - name: Print P3Q.3B diagnostics
        if: always()
        shell: bash
        run: |
          set +e
          echo "=== working directory ==="
          pwd
          echo "=== output files ==="
          ls -lah output/face-sculpt-v2/ || true
          find output/face-sculpt-v2 -maxdepth 1 -type f -print 2>/dev/null || true
          echo "=== build summary ==="
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/face-sculpt-v2")
          for filename in ("build-result.json", "fresh-import.json"):
              path = root / filename
              print(filename, "exists=", path.exists(), "size=", path.stat().st_size if path.exists() else None)
          try:
              result = json.loads((root / "build-result.json").read_text())
              print(json.dumps({
                  "face_profile": result.get("face_profile"),
                  "applied_target_count": len(result.get("applied_face_targets", [])),
                  "helper_cleanup": result.get("helper_cleanup"),
                  "structural": result.get("structural"),
                  "visual_evidence": result.get("visual_evidence"),
              }, indent=2))
          except Exception as exc:
              print("build-result diagnostic error:", repr(exc))
          try:
              fresh = json.loads((root / "fresh-import.json").read_text())
              print("fresh_import=", json.dumps(fresh, indent=2))
          except Exception as exc:
              print("fresh-import diagnostic error:", repr(exc))
          PY
          exit 0

      - name: Verify P3Q.3B structural contract
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            generic-character-face-sculpt-v2.blend \
            generic-character-face-sculpt-v2.glb \
            front.png \
            three-quarter.png \
            profile.png \
            face-close.png \
            build-result.json \
            fresh-import.json; do
            test -s "$SF_OUTPUT_DIR/$file" || { echo "missing: $file"; exit 1; }
          done

          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["SF_OUTPUT_DIR"])
          result = json.loads((root / "build-result.json").read_text())
          fresh = json.loads((root / "fresh-import.json").read_text())
          manifest = json.loads(Path("fixtures/generic-character-v1.json").read_text())

          checks = [
              ("mpfb version", result["runtime"]["mpfb"] == "2.0.17"),
              ("profile id", result["face_profile"]["profile_id"] == "face-sculpt-v2"),
              ("body lock", result["locked_body_controls"] == manifest["phenotype"]),
              ("target count", len(result["applied_face_targets"]) >= 18),
              ("mask modifiers present", bool(result["helper_cleanup"]["mask_modifiers_applied"])),
              ("helper vertices reduced", result["helper_cleanup"]["vertices_after"] < result["helper_cleanup"]["vertices_before"]),
              ("skin count", result["structural"]["skin_count"] == 1),
              ("joint count", result["structural"]["joint_count"] == 53),
              ("fresh mesh", fresh["mesh_objects"] >= 1),
              ("fresh armature", fresh["armatures"] == 1),
              ("fresh joints", fresh["joint_count"] == 53),
              ("visual evidence", result["visual_evidence"] == ["front.png", "three-quarter.png", "profile.png", "face-close.png"]),
          ]
          failed = [name for name, ok in checks if not ok]
          for name, ok in checks:
              print(f"{'PASS' if ok else 'FAIL'}: {name}")
          if failed:
              raise SystemExit("P3Q.3B contract failed: " + ", ".join(failed))
          PY
