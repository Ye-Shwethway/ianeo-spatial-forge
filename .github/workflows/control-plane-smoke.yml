name: Control Plane Smoke

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "deploy/**"
      - ".github/workflows/control-plane-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile control-plane/server.py

      - name: Exercise private session flow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/spatial-forge"
          mkdir -p "$ROOT/private/builds/test-build" "$ROOT/private/sessions" "$ROOT/state"
          printf 'fake-glb' > "$ROOT/private/builds/test-build/model.glb"
          printf '{"character_id":"generic-private-test","status":"success"}\n' > "$ROOT/private/builds/test-build/build-result.json"
          printf 'png' > "$ROOT/private/builds/test-build/front.png"
          printf 'png' > "$ROOT/private/builds/test-build/three-quarter.png"
          printf '{"build_id":"test-build","expires_at":1}\n' > "$ROOT/private/sessions/expired.json"

          SF_ROOT="$ROOT" \
          SF_CONTROL_TOKEN="test-control-token" \
          SF_VERSION="${GITHUB_SHA}" \
          SF_VIEWER_ORIGIN="https://forge.drthorne.uk" \
          SF_ASSET_ORIGIN="https://assets.example.test" \
          SF_PORT=18792 \
          python3 control-plane/server.py >/tmp/spatial-forge-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18792/health >/tmp/health.json && break
            sleep 0.25
          done
          grep -q 'ianeo-spatial-forge' /tmp/health.json
          test ! -e "$ROOT/private/sessions/expired.json"

          test "$(curl -sS -o /tmp/unauth -w '%{http_code}' http://127.0.0.1:18792/v1/builds/test-build)" = "401"

          curl -fsS \
            -H 'Authorization: Bearer test-control-token' \
            http://127.0.0.1:18792/v1/builds/test-build \
            | grep -q 'generic-private-test'

          curl -fsS \
            -H 'Authorization: Bearer test-control-token' \
            -H 'Content-Type: application/json' \
            -d '{"ttl_seconds":300}' \
            http://127.0.0.1:18792/v1/builds/test-build/viewer-session \
            > /tmp/session.json

          python3 - <<'PY'
          import json
          from urllib.parse import parse_qs, urlparse
          data = json.load(open('/tmp/session.json'))
          parsed = urlparse(data['viewer_url'])
          assert parsed.scheme == 'https'
          assert parsed.netloc == 'forge.drthorne.uk'
          query = parse_qs(parsed.query)
          model = query['model'][0]
          assert model.startswith('https://assets.example.test/s/')
          assert model.endswith('/model.glb')
          open('/tmp/model-url', 'w').write(model)
          assert 'expires_at' in data
          PY

          MODEL_URL=$(cat /tmp/model-url)
          MODEL_PATH=${MODEL_URL#https://assets.example.test}
          curl -fsS -D /tmp/headers.txt "http://127.0.0.1:18792${MODEL_PATH}" -o /tmp/model.glb
          test "$(cat /tmp/model.glb)" = "fake-glb"
          grep -qi '^Access-Control-Allow-Origin: https://forge.drthorne.uk' /tmp/headers.txt
          grep -qi '^Access-Control-Allow-Credentials: true' /tmp/headers.txt
          grep -qi '^Cache-Control: private, no-store' /tmp/headers.txt
          grep -qi '^Referrer-Policy: no-referrer' /tmp/headers.txt
          grep -qi '^X-Content-Type-Options: nosniff' /tmp/headers.txt

          EXPIRED_ID='aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          printf '{"build_id":"test-build","expires_at":1}\n' > "$ROOT/private/sessions/${EXPIRED_ID}.json"
          test "$(curl -sS -o /tmp/expired -w '%{http_code}' "http://127.0.0.1:18792/s/${EXPIRED_ID}/model.glb")" = "404"
          test ! -e "$ROOT/private/sessions/${EXPIRED_ID}.json"

          echo "Control plane smoke PASS"

# This workflow gates the production VPS deploy via workflow_run.
