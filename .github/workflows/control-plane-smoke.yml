name: Control Plane Smoke

on:
  push:
    branches: [main]
    paths:
      - "control-plane/**"
      - "deploy/**"
      - ".github/workflows/control-plane-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax check
        run: python3 -m py_compile control-plane/server.py

      - name: Exercise private session flow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/spatial-forge"
          mkdir -p "$ROOT/private/builds/test-build" "$ROOT/private/sessions" "$ROOT/state"
          printf 'fake-glb' > "$ROOT/private/builds/test-build/model.glb"
          printf '{"character_id":"generic-private-test","status":"success"}\n' > "$ROOT/private/builds/test-build/build-result.json"
          printf 'png' > "$ROOT/private/builds/test-build/front.png"
          printf 'png' > "$ROOT/private/builds/test-build/three-quarter.png"

          SF_ROOT="$ROOT" \
          SF_CONTROL_TOKEN="test-control-token" \
          SF_VERSION="${GITHUB_SHA}" \
          SF_PORT=18792 \
          python3 control-plane/server.py >/tmp/spatial-forge-server.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT

          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:18792/health >/tmp/health.json && break
            sleep 0.25
          done
          grep -q 'ianeo-spatial-forge' /tmp/health.json

          test "$(curl -sS -o /tmp/unauth -w '%{http_code}' http://127.0.0.1:18792/v1/builds/test-build)" = "401"

          curl -fsS \
            -H 'Authorization: Bearer test-control-token' \
            http://127.0.0.1:18792/v1/builds/test-build \
            | grep -q 'generic-private-test'

          curl -fsS \
            -H 'Authorization: Bearer test-control-token' \
            -H 'Content-Type: application/json' \
            -d '{"ttl_seconds":300}' \
            http://127.0.0.1:18792/v1/builds/test-build/viewer-session \
            > /tmp/session.json

          python3 - <<'PY'
          import json
          from urllib.parse import parse_qs, urlparse
          data = json.load(open('/tmp/session.json'))
          parsed = urlparse(data['viewer_url'])
          query = parse_qs(parsed.query)
          model = query['model'][0]
          assert model.startswith('/s/') and model.endswith('/model.glb')
          open('/tmp/model-path', 'w').write(model)
          assert 'expires_at' in data
          PY

          MODEL_PATH=$(cat /tmp/model-path)
          curl -fsS "http://127.0.0.1:18792${MODEL_PATH}" -o /tmp/model.glb
          test "$(cat /tmp/model.glb)" = "fake-glb"

          grep -q 'Access-Control-Allow-Origin: https://forge.drthorne.uk' <(curl -sSI "http://127.0.0.1:18792${MODEL_PATH}" || true) || true
          echo "Control plane smoke PASS"
