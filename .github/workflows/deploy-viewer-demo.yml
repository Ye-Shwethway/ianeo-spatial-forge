name: Deploy Proven Generic Viewer Demo

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-viewer-demo.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy-demo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download proven P2.4 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p viewer/demo
          gh run download 32864975879 \
            --repo "${{ github.repository }}" \
            --name spatial-forge-character-manifest \
            --dir viewer/demo

      - name: Verify staged generic demo assets
        run: |
          test -s viewer/demo/generic-unsupported-v1.glb
          test -s viewer/demo/front.png
          test -s viewer/demo/three-quarter.png
          test -s viewer/demo/build-result.json
          python - <<'PY'
          import json
          from pathlib import Path

          result = json.loads(Path('viewer/demo/build-result.json').read_text())
          assert result['character_id'] == 'generic-unsupported'
          assert result['status'] == 'success'
          assert result['structural']['joint_count'] == 53
          assert result['unsupported_fields'][0]['field'] == 'chest_circumference'
          assert 'chest_circumference' not in result['applied_controls']
          print('Generic demo metadata verified')
          PY

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy viewer and demo to Cloudflare Pages
        run: npx wrangler@latest pages deploy viewer --project-name=ianeo-spatial-forge --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify live demo assets
        run: |
          ready=false
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              https://forge.drthorne.uk/demo/build-result.json \
              | grep -q 'generic-unsupported'; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true

          curl --fail --silent --show-error \
            --output /tmp/model.glb \
            https://forge.drthorne.uk/demo/generic-unsupported-v1.glb
          test "$(wc -c < /tmp/model.glb)" -gt 8000000

          curl --fail --silent --show-error \
            --output /tmp/front.png \
            https://forge.drthorne.uk/demo/front.png
          test "$(wc -c < /tmp/front.png)" -gt 100000

          curl --fail --silent --show-error \
            'https://forge.drthorne.uk/?model=/demo/generic-unsupported-v1.glb&meta=/demo/build-result.json&front=/demo/front.png&threeQuarter=/demo/three-quarter.png&title=Generic%20Character%20P2.4' \
            | grep -q 'IANEO Spatial Forge'
