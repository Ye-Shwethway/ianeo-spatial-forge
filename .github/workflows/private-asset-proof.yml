name: Private Asset Proof

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/private-asset-proof.yml"

permissions:
  contents: read

concurrency:
  group: spatial-forge-private-asset-proof
  cancel-in-progress: false

jobs:
  build-stage-install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BLENDER_VERSION: "4.5.12"
      BLENDER_ARCHIVE: "blender-4.5.12-linux-x64.tar.xz"
      BLENDER_URL: "https://download.blender.org/release/Blender4.5/blender-4.5.12-linux-x64.tar.xz"
      SF_MANIFEST: "${{ github.workspace }}/fixtures/generic-character-unsupported-v1.json"
      SF_OUTPUT_DIR: "${{ github.workspace }}/output/private-proof"
      SF_EXPECTED_MPFB_VERSION: "2.0.17"
      SF_GLB_PATH: "${{ github.workspace }}/output/private-proof/generic-unsupported-v1.glb"
      SF_FRESH_IMPORT_RESULT: "${{ github.workspace }}/output/private-proof/fresh-import.json"
      VPS_HOST: ${{ secrets.SPATIALFORGE_VPS_HOST }}
      VPS_PORT: ${{ secrets.SPATIALFORGE_VPS_PORT }}
      VPS_USER: ${{ secrets.SPATIALFORGE_VPS_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install headless render runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1

      - name: Download Blender
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/blender"
          curl --fail --location --retry 3 "$BLENDER_URL" --output "$RUNNER_TEMP/$BLENDER_ARCHIVE"
          tar -xJf "$RUNNER_TEMP/$BLENDER_ARCHIVE" -C "$RUNNER_TEMP/blender" --strip-components=1
          "$RUNNER_TEMP/blender/blender" --version

      - name: Install MPFB extension
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --online-mode --command extension install -s -e mpfb
          "$RUNNER_TEMP/blender/blender" --command extension list | grep -i mpfb

      - name: Build generic proof character
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$SF_OUTPUT_DIR"
          "$RUNNER_TEMP/blender/blender" --background --python scripts/build_character.py

      - name: Fresh-import exported GLB
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/blender/blender" --background --python scripts/validate_glb.py

      - name: Verify proof payload
        shell: bash
        run: |
          set -euo pipefail
          test -s "$SF_OUTPUT_DIR/generic-unsupported-v1.glb"
          test -s "$SF_OUTPUT_DIR/build-result.json"
          test -s "$SF_OUTPUT_DIR/front.png"
          test -s "$SF_OUTPUT_DIR/three-quarter.png"
          test -s "$SF_OUTPUT_DIR/fresh-import.json"
          python -m json.tool "$SF_OUTPUT_DIR/build-result.json" >/dev/null
          python -m json.tool "$SF_OUTPUT_DIR/fresh-import.json" >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('output/private-proof/fresh-import.json').read_text())
          assert result['mesh_objects'] >= 1
          assert result['armatures'] == 1
          assert result['joint_count'] == 53
          print(json.dumps(result, indent=2))
          PY

      - name: Configure pinned SSH identity
        shell: bash
        env:
          VPS_SSH_KEY_B64: ${{ secrets.SPATIALFORGE_VPS_SSH_KEY_B64 }}
          VPS_KNOWN_HOSTS: ${{ secrets.SPATIALFORGE_VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_PORT"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY_B64"
          test -n "$VPS_KNOWN_HOSTS"
          install -d -m 0700 "$HOME/.ssh"
          printf '%s' "$VPS_SSH_KEY_B64" | tr -d '[:space:]' | base64 --decode > "$HOME/.ssh/id_ed25519"
          chmod 0600 "$HOME/.ssh/id_ed25519"
          ssh-keygen -y -f "$HOME/.ssh/id_ed25519" >/dev/null
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 0600 "$HOME/.ssh/known_hosts"

      - name: Stage allowed private assets
        shell: bash
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/stage"
          mkdir -p "$STAGE"
          cp "$SF_OUTPUT_DIR/generic-unsupported-v1.glb" "$STAGE/model.glb"
          cp "$SF_OUTPUT_DIR/build-result.json" "$STAGE/build-result.json"
          cp "$SF_OUTPUT_DIR/front.png" "$STAGE/front.png"
          cp "$SF_OUTPUT_DIR/three-quarter.png" "$STAGE/three-quarter.png"
          tar -C "$STAGE" -cf - model.glb build-result.json front.png three-quarter.png | \
            ssh -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
              "$VPS_USER@$VPS_HOST" \
              'set -e; rm -rf /srv/ianeo-spatial-forge/app/build-staging/current; mkdir -p /srv/ianeo-spatial-forge/app/build-staging/current; tar -xf - -C /srv/ianeo-spatial-forge/app/build-staging/current'

      - name: Promote staged build privately
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'sudo /usr/local/sbin/ianeo-spatial-forge-install-proof-build'

      - name: Verify service remains healthy
        shell: bash
        run: |
          set -euo pipefail
          ssh -p "$VPS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$VPS_USER@$VPS_HOST" \
            'curl -fsS http://127.0.0.1:18792/health | grep -q '"'"'ianeo-spatial-forge'"'"''

      - name: Upload build proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: spatial-forge-private-proof-source
          path: output/private-proof/
          if-no-files-found: error
          retention-days: 3
